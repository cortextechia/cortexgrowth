<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#1e3a8a"/>
  <!-- connections -->
  <g stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <line x1="5" y1="5"  x2="13" y2="10"/>
    <line x1="5" y1="16" x2="5"  y2="5"/>
    <line x1="5" y1="16" x2="13" y2="10"/>
    <line x1="5" y1="16" x2="13" y2="22"/>
    <line x1="5" y1="27" x2="5"  y2="16"/>
    <line x1="5" y1="27" x2="13" y2="22"/>
    <line x1="13" y1="10" x2="13" y2="22"/>
  </g>
  <!-- arrow upper -->
  <line x1="13" y1="11" x2="25" y2="11" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <polyline points="21,7 27,11 21,15" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow lower -->
  <line x1="13" y1="21" x2="25" y2="21" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <polyline points="21,17 27,21 21,25" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nodes -->
  <circle cx="5"  cy="5"  r="2" fill="white"/>
  <circle cx="5"  cy="16" r="2" fill="white"/>
  <circle cx="5"  cy="27" r="2" fill="white"/>
  <circle cx="13" cy="10" r="2" fill="white"/>
  <circle cx="13" cy="22" r="2" fill="white"/>
</svg>
