<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem conexão — Cromalex Growth</title>
  <style>
    :root { --bg: #0c0d0f; --card: #131417; --line: #1f2226; --text: #eceef1; --muted: #a6abb3; --accent: #c8ff3e; --on-accent: #0c0d0f; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f4f5f7; --card: #ffffff; --line: #e3e5e8; --text: #0c0d0f; --muted: #4b5058; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width: 100%; max-width: 360px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { margin: 16px 0 6px; font-size: 20px; }
    p { margin: 0; color: var(--muted); }
    button { margin-top: 20px; border: 0; border-radius: 10px; padding: 12px 20px; font: 700 15px system-ui, sans-serif;
      background: var(--accent); color: var(--on-accent); cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>O celular está sem internet. Assim que a conexão voltar, toque em tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
